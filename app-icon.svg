<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- La mascotte de la bulle (Orb.tsx, .orb dans styles.css) : même forme organique, mêmes couleurs.
       Fond transparent pour rester lisible dans la barre des tâches et la zone de notification. -->
  <defs>
    <!-- La forme de .orb : border-radius 38% 62% 56% 44% / 46% 40% 60% 54%. -->
    <path id="blob" d="M406 72 A546 352 0 0 1 952 424 A493 528 0 0 1 459 952 A387 475 0 0 1 72 477 A334 405 0 0 1 406 72 Z"/>
    <clipPath id="clip"><use href="#blob"/></clipPath>
    <linearGradient id="base" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#6b4bff"/>
      <stop offset="0.6" stop-color="#1fa8ff"/>
      <stop offset="1" stop-color="#ff5fa8"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <radialGradient id="shine" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#clip)">
    <use href="#blob" fill="url(#base)"/>
    <!-- Les trois taches floues qui irisent l'orbe. -->
    <circle cx="300" cy="330" r="330" fill="#7c5cff" filter="url(#soft)"/>
    <circle cx="760" cy="740" r="320" fill="#19d3ff" filter="url(#soft)"/>
    <circle cx="640" cy="220" r="250" fill="#ff4fa3" filter="url(#soft)"/>
    <ellipse cx="360" cy="250" rx="210" ry="120" fill="url(#shine)" transform="rotate(-24 360 250)"/>
  </g>
  <use href="#blob" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="14"/>

  <!-- Le visage, un peu épaissi pour rester visible en 16 px. -->
  <ellipse cx="380" cy="440" rx="66" ry="84" fill="#fff"/>
  <ellipse cx="644" cy="440" rx="66" ry="84" fill="#fff"/>
  <path d="M352 612 Q512 752 672 612" fill="none" stroke="#fff" stroke-width="80" stroke-linecap="round"/>
</svg>
